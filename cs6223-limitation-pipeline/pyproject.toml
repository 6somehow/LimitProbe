[project]
name = "cs6223-limitation-pipeline"
version = "0.1.0"
description = "Find, cross-check and test limitations of systems research prototypes (paper + repo)."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
solver = ["z3-solver>=4.12"]
llm = ["openai", "python-dotenv", "anthropic"]
verify = ["pymupdf", "rank-bm25", "z3-solver>=4.12", "openai", "python-dotenv", "pypdf", "jsonschema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", "out", ".git"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["schema", "codeside", "pipeline", "scorer_limitset", "confidence_limitset", "limitset_baselines", "paperside_bridge", "checklimits"]
package-dir = {checklimits = "checklimits/checklimits"}
