[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperprobe"
version = "0.1.0"
description = "Evidence-grounded candidate testing specifications for research software"
requires-python = ">=3.10"
dependencies = ["pypdf>=4,<7"]

[project.optional-dependencies]
team = ["pydantic>=2.5", "z3-solver>=4.12", "rank-bm25>=0.2.2"]
vision = ["pymupdf>=1.24"]
dev = ["pytest>=7"]

[project.scripts]
paperprobe = "paperprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
