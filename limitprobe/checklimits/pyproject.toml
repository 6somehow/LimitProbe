[project]
name = "checklimits"
version = "0.1.0"
description = "check_limits: verify limitation findings on CPU with a deterministic harness"
requires-python = ">=3.12"  # tracer uses sys.monitoring
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["checklimits"]
